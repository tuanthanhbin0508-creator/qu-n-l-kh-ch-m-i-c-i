<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4C0519" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#FDA4AF" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Center badge: Book + Heart + Rings -->
  <g filter="url(#shadow)" transform="translate(96, 86)">
    <!-- Book/Register Base -->
    <path d="M40 40 H280 Q290 40 290 50 V260 Q290 270 280 270 H40 Q30 270 30 260 V50 Q30 40 40 40 Z" fill="#FFFFFF" fill-opacity="0.95"/>
    <path d="M40 40 H160 V270 H40 Z" fill="#FFF1F2"/>
    <line x1="160" y1="40" x2="160" y2="270" stroke="#E2E8F0" stroke-width="4"/>
    
    <!-- Lines in book -->
    <line x1="60" y1="80" x2="135" y2="80" stroke="#FDA4AF" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="110" x2="135" y2="110" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="140" x2="120" y2="140" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
    
    <line x1="185" y1="80" x2="260" y2="80" stroke="#FDA4AF" stroke-width="6" stroke-linecap="round"/>
    <line x1="185" y1="110" x2="260" y2="110" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
    <line x1="185" y1="140" x2="245" y2="140" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>

    <!-- Intertwined Wedding Rings with Gold Gradient -->
    <circle cx="120" cy="205" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="10"/>
    <circle cx="158" cy="205" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="10"/>
    
    <!-- Heart above -->
    <path d="M160 52 C145 28 115 32 115 56 C115 80 160 106 160 106 C160 106 205 80 205 56 C205 32 175 28 160 52 Z" fill="#E11D48"/>
  </g>

  <!-- Bottom Label -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
    KHÁCH MỜI
  </text>
</svg>
